<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hakari</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main>
  <h1>Hakari</h1>
  <nav><a href="/" aria-current="page">1件ずつ判定</a><a href="/batch">CSV で一括タグ付け</a></nav>
  <form id="form">
    <label for="context">文脈 <small>判定対象の文章</small></label>
    <textarea id="context" required></textarea>

    <label for="field">項目名</label>
    <input id="field" required placeholder="例: sentiment">

    <label for="meaning">項目の意味 <small>任意</small></label>
    <input id="meaning" placeholder="例: レビュー全体の感情">

    <label>選択肢 <small>ラベル（必須）と説明（任意）</small></label>
    <div id="choices"></div>
    <button type="button" id="add">選択肢を追加</button>

    <div><button type="submit" class="primary" id="submit">判定する</button></div>
  </form>
  <section id="result" aria-live="polite"></section>
</main>
<script>
const MAX = 26;
const choicesEl = document.getElementById("choices");
const resultEl = document.getElementById("result");

function renumber() {
  [...choicesEl.children].forEach((row, i) => {
    row.querySelector(".code").textContent = String.fromCharCode(65 + i);
  });
  document.getElementById("add").disabled = choicesEl.children.length >= MAX;
}

function addChoice(label = "", description = "") {
  const row = document.createElement("div");
  row.className = "choice";
  row.innerHTML = '<span class="code"></span><input class="label" required placeholder="ラベル">' +
    '<input class="desc" placeholder="説明"><button type="button" aria-label="削除">×</button>';
  row.querySelector(".label").value = label;
  row.querySelector(".desc").value = description;
  row.querySelector("button").onclick = () => {
    if (choicesEl.children.length > 2) { row.remove(); renumber(); }
  };
  choicesEl.appendChild(row);
  renumber();
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function showResult(data) {
  resultEl.replaceChildren();
  resultEl.append(el("div", null, "回答"), el("div", "answer", data.answer));
  for (const p of data.probabilities) {
    const row = el("div", "row");
    const bar = el("div", "bar");
    const fill = el("div", "fill");
    fill.style.width = (p.probability * 100).toFixed(1) + "%";
    bar.append(fill);
    row.append(el("span", "name", `${p.code}: ${p.label}`), bar, el("span", "pct", (p.probability * 100).toFixed(1) + "%"));
    resultEl.append(row);
  }
}

function showError(msg) {
  resultEl.replaceChildren(el("p", "error", msg));
}

document.getElementById("add").onclick = () => addChoice();

document.getElementById("form").onsubmit = async (ev) => {
  ev.preventDefault();
  const submit = document.getElementById("submit");
  const body = {
    context: document.getElementById("context").value,
    field: document.getElementById("field").value,
    meaning: document.getElementById("meaning").value,
    choices: [...choicesEl.children].map((row) => ({
      label: row.querySelector(".label").value,
      description: row.querySelector(".desc").value,
    })),
  };
  submit.disabled = true;
  resultEl.replaceChildren(el("p", null, "判定中…"));
  try {
    const res = await fetch("/api/decide", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!res.ok) {
      showError(typeof data.detail === "string" ? data.detail : "入力内容を確認してください");
    } else {
      showResult(data);
    }
  } catch (e) {
    showError("サーバーに接続できない: " + e.message);
  } finally {
    submit.disabled = false;
  }
};

addChoice();
addChoice();
</script>
</body>
</html>
